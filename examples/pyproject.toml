[project]
name = "agentreplay-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["agentreplay-sdk>=0.1.0"]

[project.scripts]
agentreplay-demo = "agentreplay_examples.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentreplay_examples*"]
