[project]
name = "agentreplay-api"
version = "0.1.0"
description = "Local-first trace storage and replay API"
requires-python = ">=3.11"
dependencies = ["agentreplay-sdk>=0.1.0", "agentreplay-examples>=0.1.0", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
